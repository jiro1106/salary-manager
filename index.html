    <!--
      Plus Jakarta Sans: geometric humanist, open apertures, and far lighter
      in the stroke than a rounded face at the same weight, so the extrabold
      display figures read as display rather than as bulk. It ships ₱
      (U+20B1) so money needs no fallback face — check that before swapping
      this out, since most geometric sans on Google Fonts (Figtree, Outfit,
      Poppins, DM Sans, Urbanist, Rubik) declare the latin-ext unicode-range
      and then ship no peso glyph inside it.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&display=swap"
      rel="stylesheet"
    />
